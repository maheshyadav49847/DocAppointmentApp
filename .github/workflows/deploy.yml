name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - main # Change to master if your default branch is master
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Environment to Deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - sandbox
          - prod

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set lower case owner name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./DocAppointment/FrontendV2
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}

      # Build & Push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./DocAppointment/Backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}

      # Build & Push WhatsApp Bridge
      - name: Build and push WhatsApp Bridge
        uses: docker/build-push-action@v5
        with:
          context: ./DocAppointment/whatsapp-bridge
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/whatsapp-bridge:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/whatsapp-bridge:${{ github.sha }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env || 'prod' }}
    
    steps:
      - name: Checkout repository (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.yml"
          target: "~/docappointment"

      - name: Execute Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Create directory if doesn't exist
            mkdir -p ~/docappointment
            cd ~/docappointment
            
            # Login to GitHub Container Registry so VPS can pull private packages
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Determine ports based on environment
            TARGET_ENV="${{ github.event.inputs.target_env || 'prod' }}"
            if [ "$TARGET_ENV" = "prod" ]; then
              export FRONTEND_PORT=8000
              export BACKEND_PORT=8080
              export WHATSAPP_PORT=3101
            elif [ "$TARGET_ENV" = "dev" ]; then
              export FRONTEND_PORT=8001
              export BACKEND_PORT=8081
              export WHATSAPP_PORT=3102
            elif [ "$TARGET_ENV" = "sandbox" ]; then
              export FRONTEND_PORT=8002
              export BACKEND_PORT=8082
              export WHATSAPP_PORT=3103
            fi
            
            # Export variables for docker-compose file to resolve
            export GITHUB_REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Capitalize first letter of target env (e.g. dev -> Dev, prod -> Prod)
            CAP_ENV="$(echo "$TARGET_ENV" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
            # Replace the Database name dynamically to isolate databases per environment
            export DB_CONNECTION_STRING=$(echo "${{ secrets.DB_CONNECTION_STRING }}" | sed -E "s/Database=[^;]+/Database=DocAppointmentDb_${CAP_ENV}/")
            
            export VPS_IP="${{ secrets.VPS_IP }}"
            export IMAGE_TAG="${{ github.sha }}"
            
            # Nuke all existing containers for this app to prevent port conflicts and ghost instances
            docker ps -a -q --filter "ancestor=ghcr.io/${GITHUB_REPOSITORY}/frontend" | xargs -r docker rm -f || true
            docker ps -a -q --filter "ancestor=ghcr.io/${GITHUB_REPOSITORY}/backend" | xargs -r docker rm -f || true
            docker ps -a -q --filter "ancestor=ghcr.io/${GITHUB_REPOSITORY}/whatsapp-bridge" | xargs -r docker rm -f || true
            
            docker ps -a -q --filter "name=frontend" | xargs -r docker rm -f || true
            docker ps -a -q --filter "name=backend" | xargs -r docker rm -f || true
            docker ps -a -q --filter "name=whatsapp" | xargs -r docker rm -f || true
            
            # Also clean up standard docker-compose networks if needed
            docker network prune -f || true
            
            # Pull latest images and start containers under a unique project name
            docker compose -p "docappointment-$TARGET_ENV" pull
            docker compose -p "docappointment-$TARGET_ENV" up -d
            
            # Prune old dangling images to save disk space
            docker image prune -f

            # --- AUTOMATE NGINX REVERSE PROXY SETUP ---
            cat << 'EOF' > /tmp/docappointment.conf
            server {
                listen 80;
                server_name _;
                location / { proxy_pass http://localhost:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; }
                location /api/ { proxy_pass http://localhost:8080/api/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'keep-alive'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
                location /queueHub { proxy_pass http://localhost:8080/queueHub; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 100s; }
                location /qr/ { proxy_pass http://localhost:3101/qr/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; }
            }
            server {
                listen 81;
                server_name _;
                location / { proxy_pass http://localhost:8001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; }
                location /api/ { proxy_pass http://localhost:8081/api/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'keep-alive'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
                location /queueHub { proxy_pass http://localhost:8081/queueHub; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 100s; }
                location /qr/ { proxy_pass http://localhost:3102/qr/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; }
            }
            server {
                listen 82;
                server_name _;
                location / { proxy_pass http://localhost:8002; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; }
                location /api/ { proxy_pass http://localhost:8082/api/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'keep-alive'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
                location /queueHub { proxy_pass http://localhost:8082/queueHub; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 100s; }
                location /qr/ { proxy_pass http://localhost:3103/qr/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; }
            }
            EOF
            
            if ! command -v nginx >/dev/null 2>&1; then
              echo "Installing nginx..."
              apt-get update && apt-get install -y nginx || true
            fi
            
            if command -v nginx >/dev/null 2>&1; then
              # Use conf.d which is universal across all Linux distros
              mkdir -p /etc/nginx/conf.d
              mv /tmp/docappointment.conf /etc/nginx/conf.d/docappointment.conf
              # Remove default configs if they exist to prevent port 80 conflicts
              rm -f /etc/nginx/sites-enabled/default || true
              rm -f /etc/nginx/conf.d/default.conf || true
              systemctl restart nginx || echo "Nginx restart failed"
            fi
