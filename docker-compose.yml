version: '3.8'

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - NODE_ENV=production

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    restart: always
    network_mode: "host"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedOrigins=http://${VPS_IP}
      # Point this to your EXISTING database on the VPS. 
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Host=localhost;Database=DocAppointmentDb_Prod;Username=postgres;Password=sa}

  whatsapp-bridge:
    image: ghcr.io/${GITHUB_REPOSITORY}/whatsapp-bridge:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${WHATSAPP_PORT:-3101}:3101"
    volumes:
      - whatsapp_sessions:/app/sessions
    environment:
      - NODE_ENV=production

volumes:
  whatsapp_sessions:
    name: docappointment_whatsapp_sessions
